name: siakar_mobile
description: "Aplikasi Absensi Karyawan Berbasis Mobile SIAKAR (Clean Architecture + Cubit)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  dio: ^5.4.0
  go_router: ^13.2.0
  flutter_secure_storage: ^9.0.0
  camera: ^0.10.5+9
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  image: ^4.1.7
  tflite_flutter: ^0.10.4
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/preprocess.json
